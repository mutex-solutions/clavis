name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so leaks in old commits are caught

      # The gitleaks *action* requires a paid licence for organisation-owned
      # repositories ("[mutex-solutions] is an organization. License key is
      # required."). The CLI is MIT-licensed and performs the same scan, so run
      # it directly rather than paying for the wrapper.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan
        run: gitleaks detect --config .gitleaks.toml --redact --verbose --exit-code 1
