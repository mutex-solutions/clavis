name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update the Homebrew tap (macOS + Linux formula) from the release
      # checksums. Authenticates with a write-enabled *deploy key* on the tap
      # repo (secret HOMEBREW_TAP_DEPLOY_KEY), not a PAT: a deploy key is scoped
      # to that one repository and does not expire. The step self-skips when the
      # secret is unset (the `secrets` context is NOT allowed in a step `if`, so
      # we gate inside the shell), so a release never fails on a missing key.
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "${TAP_DEPLOY_KEY}" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY not set; skipping tap update."
            exit 0
          fi
          ver="${GITHUB_REF_NAME#v}"
          # Give the release a moment so checksums.txt is fetchable.
          for i in $(seq 1 10); do
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${ver}/checksums.txt" -o /tmp/sums.txt && break
            sleep 5
          done
          sh scripts/gen-formula.sh "$ver" /tmp/sums.txt > /tmp/clavis.rb

          # Deploy-key auth. IdentitiesOnly keeps the runner from offering any
          # other key, and GIT_SSH_COMMAND covers the clone and the push that
          # follows it.
          mkdir -p ~/.ssh
          printf '%s\n' "${TAP_DEPLOY_KEY}" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o IdentitiesOnly=yes"

          git clone --quiet git@github.com:mutex-solutions/homebrew-tap.git /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/clavis.rb /tmp/tap/Formula/clavis.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add Formula/clavis.rb
            git commit -m "clavis ${ver}"
            git push
          fi
