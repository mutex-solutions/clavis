version: 2

project_name: clavis

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/clavis
    binary: clavis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [tar.gz]
    # Lowercase, stable names: clavis_linux_amd64.tar.gz etc.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

# Homebrew is handled by a dedicated release-workflow step (not goreleaser):
# goreleaser's cask output is macOS-only, but our hand-generated formula covers
# macOS AND Linux (Linuxbrew). See .github/workflows/release.yml + RELEASING.md.

release:
  draft: false
  prerelease: auto
